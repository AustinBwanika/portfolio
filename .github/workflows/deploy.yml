name: Deploy portfolio to GitHub Pages
# Publishing is deliberate: run this workflow from the Actions tab.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check, build and upload static site
        uses: withastro/action@v6
        with:
          node-version: '22.23.4'
          package-manager: npm@10.9.9
          build-cmd: npm run check && npm run build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
